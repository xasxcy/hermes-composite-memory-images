name: Build & Push Mem0 image

on:
  push:
    branches: [main]
    paths:
      - 'mem0/Dockerfile'
      - '.github/workflows/build-mem0.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/xasxcy/hermes-mem0
  IMAGE_TAG: 2.0.18-001c2352
  PYTHON_BASE_IMAGE: python:3.12-slim@sha256:dd29372629eeba2dd003fd9e9d35a5b8236c44727875a0364254b5127af88e65
  MEM0_COMMIT: 001c235229be8795e3834520467bd0d661ed8f34

jobs:
  build:
    name: Build Mem0 server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: mem0
          file: mem0/Dockerfile
          pull: true
          push: true
          provenance: false
          build-args: |
            PYTHON_BASE_IMAGE=${{ env.PYTHON_BASE_IMAGE }}
            MEM0_COMMIT=${{ env.MEM0_COMMIT }}
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max

      - name: Publish pinned reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "## Mem0 image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: \`${IMAGE}:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- pin (use this on NAS): \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
